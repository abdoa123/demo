<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6BFF">
<title>وصلني · Wasilni Rider</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --blue:#2F6BFF; --blue2:#5A8CFF; --violet:#7B61FF; --sky:#3FA9F5;
  --ink:#101A33; --muted:#6B7A99; --faint:#96A2BC; --line:#E6EBF5;
  --bg:#EEF3FC; --card:#FFFFFF; --soft:#F1F5FF; --soft2:#F7F9FF;
  --grad:linear-gradient(120deg,#2F6BFF,#7B61FF);
  --ok:#22C55E; --warn:#FFB43B; --danger:#D2472A;
  --shadow-lg:0 50px 90px -40px rgba(16,26,51,.45),0 0 0 1px rgba(16,26,51,.06);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:Tajawal,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(80% 50% at 82% -6%,#DCE8FF 0%,#EEF3FC 45%,#E7ECF7 100%);
  overflow:hidden;
}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}

/* ---------- Keyframes ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(44px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.82)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes morphA{0%,100%{border-radius:58% 42% 44% 56%/52% 48% 52% 48%;transform:rotate(0deg) scale(1)}50%{border-radius:42% 58% 60% 40%/44% 56% 44% 56%;transform:rotate(15deg) scale(1.1)}}
@keyframes morphB{0%,100%{border-radius:44% 56% 58% 42%/56% 44% 56% 44%;transform:translate(0,0) scale(1)}50%{border-radius:60% 40% 42% 58%/40% 60% 40% 60%;transform:translate(16px,-20px) scale(1.12)}}
@keyframes ping{0%{transform:scale(.5);opacity:.55}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes radar{to{transform:rotate(360deg)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sweep{0%{transform:translateX(-150%) skewX(-18deg)}55%,100%{transform:translateX(280%) skewX(-18deg)}}
@keyframes glowPulse{0%,100%{box-shadow:0 10px 26px -10px rgba(47,107,255,.5)}50%{box-shadow:0 16px 40px -10px rgba(47,107,255,.75)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dashDraw{to{stroke-dashoffset:0}}
@keyframes barGrow{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes riseInJs{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideRight{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bellRing{0%,72%,100%{transform:rotate(0)}78%{transform:rotate(14deg)}84%{transform:rotate(-11deg)}90%{transform:rotate(7deg)}96%{transform:rotate(-4deg)}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.6}70%,100%{transform:scale(1.8);opacity:0}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* staggered reveal for home sections */
.stg{opacity:0;animation:riseInJs .6s cubic-bezier(.2,.8,.2,1) forwards}
.stg.s1{animation-delay:.05s}.stg.s2{animation-delay:.12s}.stg.s3{animation-delay:.19s}
.stg.s4{animation-delay:.26s}.stg.s5{animation-delay:.33s}.stg.s6{animation-delay:.40s}

/* section heading with accent bar */
.sec-h{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:900}
.sec-h::before{content:"";width:5px;height:18px;border-radius:99px;background:var(--grad)}

/* soft press feedback */
.tap{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.tap:active{transform:scale(.97)}

/* curvy gradient header */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2F6BFF 0%,#5D74FF 45%,#7B61FF 100%);
  border-radius:0 0 40px 40px;padding:calc(58px + var(--safe-top)) 22px 46px;color:#fff}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:34px;background:#F5F8FF;
  border-radius:50% 50% 0 0/100% 100% 0 0}
.hero .glow{position:absolute;border-radius:50%;filter:blur(4px);pointer-events:none}
.chip-live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  border-radius:99px;padding:5px 11px;font-size:10.5px;font-weight:800;backdrop-filter:blur(4px)}
.dotlive{position:relative;width:7px;height:7px;border-radius:99px;background:#8BFFC1}
.dotlive::before{content:"";position:absolute;inset:-4px;border-radius:99px;background:#8BFFC1;animation:pulseRing 1.8s ease-out infinite}

/* ---------- Stage: desktop = phone in frame, mobile = fullscreen ---------- */
.stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:28px;
}
.frame{
  position:relative;width:414px;padding:13px;border-radius:66px;
  background:linear-gradient(160deg,#FFFFFF,#D8E1F2 55%,#FFFFFF);
  box-shadow:var(--shadow-lg);
  animation:riseIn .7s cubic-bezier(.2,.8,.2,1) both;
}
.screen{
  position:relative;width:388px;
  height:820px;                                   /* fallback for any browser */
  height:min(840px,calc(var(--app-h) - 82px));    /* JS-driven, works on all iOS */
  border-radius:54px;overflow:hidden;background:#F5F8FF;isolation:isolate;
}

/* Mobile: drop the frame, go edge to edge */
@media (max-width:640px){
  body{background:#F5F8FF}
  .stage{padding:0}
  .frame{width:100%;height:100vh;height:var(--app-h);padding:0;border-radius:0;box-shadow:none;background:transparent}
  .screen{
    width:100vw;height:100vh;height:var(--app-h);border-radius:0;
  }
}

/* Ambient blobs inside screen */
.amb{position:absolute;pointer-events:none}
.amb.t{top:-80px;right:-70px;width:260px;height:260px;background:radial-gradient(circle,rgba(123,97,255,.3),transparent 68%);filter:blur(16px);animation:morphA 16s ease-in-out infinite}
.amb.b{bottom:-70px;left:-80px;width:290px;height:290px;background:radial-gradient(circle,rgba(47,107,255,.26),transparent 68%);filter:blur(20px);animation:morphB 19s ease-in-out infinite}
.bg-base{position:absolute;inset:0;background:radial-gradient(70% 40% at 84% 2%,rgba(123,97,255,.16),transparent 70%),radial-gradient(65% 40% at 6% 98%,rgba(47,107,255,.14),transparent 70%),#F5F8FF}

/* Status bar / notch */
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-family:Outfit,sans-serif;font-size:14px;font-weight:500;color:var(--ink);pointer-events:none}
.statusbar .icons{display:flex;align-items:center;gap:5px;opacity:.75}
.sig{width:15px;height:11px;background:currentColor;clip-path:polygon(0 100%,22% 100%,22% 62%,0 62%,0 100%,38% 100%,38% 40%,60% 40%,60% 100%,76% 100%,76% 12%,100% 12%,100% 100%,0 100%);display:inline-block}
.batt{width:17px;height:11px;border-radius:2px;border:1.4px solid currentColor;display:inline-block}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:106px;height:31px;border-radius:99px;background:#0B1330;z-index:90}
@media (max-width:640px){ .notch{display:none} .statusbar{padding-top:var(--safe-top)} }

/* View container */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{width:0}
.view.center{display:flex;flex-direction:column}
.hidden{display:none!important}

/* Buttons / primitives */
.btn-primary{position:relative;overflow:hidden;width:100%;border:0;cursor:pointer;border-radius:24px;padding:17px;background:var(--grad);color:#fff;font-family:Tajawal;font-size:16px;font-weight:800;animation:glowPulse 3.2s ease-in-out infinite}
.btn-primary .shine{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 3.4s ease-in-out infinite}
.btn-primary span.lbl{position:relative}
.btn-primary:active{transform:scale(.98)}
.back{border:0;cursor:pointer;width:38px;height:38px;border-radius:14px;background:#fff;box-shadow:0 6px 18px -12px rgba(16,26,51,.4);font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.back:active{transform:scale(.92)}

/* Bottom nav */
.nav{position:absolute;bottom:0;left:0;right:0;z-index:70;padding:0 16px calc(12px + var(--safe-bottom))}
.nav .bar{background:#fff;border-radius:28px;padding:8px;display:flex;gap:5px;box-shadow:0 16px 40px -18px rgba(16,26,51,.45)}
.nav button{flex:1;border:0;cursor:pointer;border-radius:21px;padding:10px 4px 8px;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .28s ease,color .28s ease}
.nav button.on{background:#E7EEFF;color:var(--blue)}
.nav .ico{font-size:16px;line-height:1}
.nav .lbl{font-size:10px;font-weight:700}
.homebar{width:120px;height:5px;border-radius:99px;background:rgba(16,26,51,.18);margin:9px auto 0}

/* Toast */
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);z-index:200;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:16px;box-shadow:0 14px 30px -14px rgba(16,26,51,.6);opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Map host — isolate so Leaflet's internal high z-indexes can't paint over the UI */
.maphost{position:absolute;left:0;right:0;overflow:hidden;background:#EDE9E2;z-index:0;isolation:isolate}
.leaflet-container{background:#EDE9E2;font-family:Tajawal,system-ui,sans-serif}
.leaflet-control-attribution{font-size:8.5px!important;background:rgba(255,255,255,.78)!important}
/* keep Leaflet panes/controls contained below overlay UI */
.maphost .leaflet-pane,.maphost .leaflet-top,.maphost .leaflet-bottom{z-index:1!important}
.mv-van{position:relative;width:40px;height:40px}
.mv-van i{position:absolute;inset:0;border-radius:99px;background:rgba(47,107,255,.3);animation:ping 2.2s ease-out infinite}
.mv-van b{position:absolute;inset:6px;border-radius:13px;background:var(--grad);box-shadow:0 8px 18px -6px rgba(47,107,255,.85);display:flex;align-items:center;justify-content:center;font-size:15px}
.mv-pin{width:24px;height:24px;border-radius:99px;border:3px solid #fff;box-shadow:0 4px 10px -3px rgba(11,19,48,.6)}
.mapbadge{position:absolute;top:10px;right:10px;z-index:500;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:11px;padding:6px 9px;box-shadow:0 6px 16px -10px rgba(11,19,48,.6)}
.mapctrl{position:absolute;bottom:14px;left:10px;z-index:500;display:flex;flex-direction:column;gap:7px}
.mapctrl button{border:0;cursor:pointer;width:36px;height:36px;border-radius:13px;background:#fff;box-shadow:0 6px 14px -8px rgba(11,19,48,.7);color:var(--ink);font-size:16px}
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <div class="screen" id="screen">
      <div class="bg-base"></div>
      <div class="amb t"></div>
      <div class="amb b"></div>

      <div class="statusbar">
        <span>9:41</span>
        <span class="icons"><span class="batt"></span><span class="sig"></span></span>
      </div>
      <div class="notch"></div>

      <!-- Views injected here -->
      <div id="views"></div>

      <!-- Bottom nav -->
      <div class="nav hidden" id="nav">
        <div class="bar" id="navbar"></div>
        <div class="homebar"></div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Wasilni Rider — standalone responsive demo
   ============================================================ */

/* ---------- Data ---------- */
const GRAD = 'linear-gradient(120deg,#2F6BFF,#7B61FF)';
const LINES = [
  { code:'D1', name:'الشاطئ ← جامعة الإمام عبدالرحمن', every:10, price:'5.00', eta:4, seats:9, tint:'#2F6BFF',
    stops:[{name:'دوار الشاطئ الغربي',time:'7:52'},{name:'شارع الأمير محمد',time:'7:58'},{name:'مجمع الظهران',time:'8:06'},{name:'بوابة الجامعة 3',time:'8:24'}] },
  { code:'D2', name:'الفيصلية ← المنطقة الصناعية 2', every:15, price:'7.00', eta:11, seats:5, tint:'#7B61FF',
    stops:[{name:'الفيصلية — سوق الجملة',time:'6:35'},{name:'طريق الملك فهد',time:'6:44'},{name:'بوابة الصناعية 2',time:'7:02'}] },
  { code:'K3', name:'كورنيش الخبر ← الظهران تكنو فالي', every:12, price:'6.00', eta:7, seats:12, tint:'#3FA9F5',
    stops:[{name:'كورنيش الخبر الشمالي',time:'7:40'},{name:'الراكة',time:'7:49'},{name:'العقربية',time:'7:56'},{name:'تكنو فالي',time:'8:12'}] }
];
const PAYS = [
  { id:'mada', name:'مدى', sub:'••• 4417 — البطاقة الافتراضية', badge:'mada', tint:'#DCE8FF' },
  { id:'apple', name:'Apple Pay', sub:'تأكيد بلمسة واحدة', badge:'', tint:'#EEF1F7' },
  { id:'stc', name:'STC Pay', sub:'محفظة مرتبطة بالجوال', badge:'stc', tint:'#EAE4FF' },
  { id:'wallet', name:'محفظة وصلني', sub:'الرصيد 42.50 ر.س', badge:'و', tint:'#E3F1FF' }
];
const PLANS = [
  { id:'week', name:'أسبوعي', badge:'مرن', detail:'10 رحلات · صالح 7 أيام', price:'59' },
  { id:'month', name:'شهري', badge:'الأكثر توفيراً', detail:'رايح-جاي · 44 رحلة · نفس الخط', price:'179' },
  { id:'term', name:'فصلي', badge:'للطلاب', detail:'3 شهور · تجميد عند الاختبارات', price:'479' }
];
const TAGS = ['نظافة العربية','التكييف','الالتزام بالوقت','تعامل السائق','نقطة الالتقاء'];
const HISTORY = [
  { code:'D1', name:'الشاطئ ← الجامعة', when:'اليوم 7:52 ص', status:'مكتملة', price:'5.00', tint:'#2F6BFF' },
  { code:'D1', name:'الجامعة ← الشاطئ', when:'أمس 2:10 م', status:'مكتملة', price:'5.00', tint:'#2F6BFF' },
  { code:'K3', name:'كورنيش الخبر ← تكنو فالي', when:'الأحد 7:40 ص', status:'مكتملة', price:'6.00', tint:'#3FA9F5' },
  { code:'D2', name:'الفيصلية ← الصناعية 2', when:'السبت 6:35 ص', status:'ملغاة — مسترجعة', price:'0.00', tint:'#7B61FF' }
];
const CHIPS = [
  { label:'الجامعة', sub:'5.00 ر.س', dest:'جامعة الإمام عبدالرحمن', line:0 },
  { label:'الشغل', sub:'7.00 ر.س', dest:'المنطقة الصناعية 2', line:1 },
  { label:'تكنو فالي', sub:'6.00 ر.س', dest:'الظهران تكنو فالي', line:2 }
];
const PERKS = ['مقعد محجوز في رحلتي الذروة','تجميد الاشتراك أسبوعين','تعويض رحلة عند تأخير يزيد 10 د','فاتورة شهرية واحدة (ZATCA)'];

/* ---------- State ---------- */
const state = {
  screen:'splash', mode:'fixed', homeVariant:'sheet', picker:'timeline',
  otp:'', resend:42, line:0, stop:0, pay:'mada', stars:0, tags:[],
  family:false, plan:'month', dest:'جامعة الإمام عبدالرحمن', tick:0, histFilter:'الكل',
  // ---- auth / onboarding ----
  authMode:'signin',            // 'signin' | 'register'
  phone:'', name:'', agree:false, userName:'سلمان القحطاني', userFirst:'سلمان'
};

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }

/* ---------- Global timer (resend + tracking) ---------- */
setInterval(() => {
  if (state.resend > 0) state.resend--;
  if (state.screen === 'track') { state.tick = Math.min(state.tick + 1, 40); if (map && trackAnim) mapUpdate(); }
  if (state.screen === 'otp') {
    const el = $('resendCount'); if (el) el.textContent = String(state.resend).padStart(2,'0');
    const wrap = $('resendWrap'), link = $('resendLink');
    if (wrap && link) {
      const active = state.resend === 0;
      wrap.style.display = active ? 'none' : 'inline';
      link.style.color = active ? '#2F6BFF' : '#96A2BC';
      link.style.fontWeight = active ? '800' : '400';
      link.style.pointerEvents = active ? 'auto' : 'none';
    }
  }
  if (state.screen === 'track') updateTrackUI();
}, 1000);

/* ---------- Router ---------- */
const NAV_SCREENS = ['home','history','subs','profile'];
function go(screen){
  const prev = state.screen;
  state.screen = screen;
  if (screen === 'track' && prev !== 'track') { state.tick = 0; }
  render();
}

/* ---------- Render dispatcher ---------- */
function render(){
  destroyMap();
  const views = $('views');
  const R = RENDERERS[state.screen] || (()=> '');
  views.innerHTML = R();
  document.querySelector('.statusbar').style.opacity = state.screen === 'splash' ? '0' : '1';
  const nav = $('nav');
  if (NAV_SCREENS.includes(state.screen)) { nav.classList.remove('hidden'); renderNav(); }
  else nav.classList.add('hidden');
  if (POST[state.screen]) POST[state.screen]();
}

function renderNav(){
  const items = [
    { id:'home', label:'الرئيسية', icon:'🏠' },
    { id:'history', label:'رحلاتي', icon:'🧭' },
    { id:'subs', label:'الاشتراك', icon:'🎟️' },
    { id:'profile', label:'حسابي', icon:'👤' }
  ];
  $('navbar').innerHTML = items.map(n =>
    `<button class="${state.screen===n.id?'on':''}" onclick="go('${n.id}')">
       <span class="ico">${n.icon}</span><span class="lbl">${n.label}</span>
     </button>`).join('');
}

const RENDERERS = {};
const POST = {};

/* ---------- Derived helpers ---------- */
function curLine(){ return LINES[state.line]; }
function userInitial(){ return (state.userFirst || 'ض').trim().charAt(0) || 'ض'; }
function displayPhone(){ const p = state.phone || '555112413'; const d = p.padStart(9,'•'); return '+966 ' + d.slice(0,2) + ' •• ' + d.slice(-4,-2) + ' ' + d.slice(-2); }
function stopName(){ const l=curLine(); return (l.stops[state.stop]||l.stops[0]).name; }
function payName(){ return (PAYS.find(p=>p.id===state.pay)||PAYS[0]).name; }

/* ============================================================
   SPLASH
   ============================================================ */
RENDERERS.splash = () => `
  <div class="view center" style="animation:fadeIn .5s ease both;background:radial-gradient(90% 60% at 50% 20%,#DCE8FF,#F5F8FF 60%);align-items:center;justify-content:center;text-align:center;padding:0 34px">
    <div style="position:absolute;top:18%;left:50%;transform:translateX(-50%);width:300px;height:300px;background:conic-gradient(from 0deg,rgba(47,107,255,.30),transparent 55%);filter:blur(30px);border-radius:50%;animation:radar 9s linear infinite"></div>
    <div style="position:relative;animation:popIn .8s cubic-bezier(.2,1.3,.4,1) both">
      <div style="width:96px;height:96px;margin:0 auto;border-radius:34px 38px 30px 42px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;color:#fff;box-shadow:0 22px 46px -16px rgba(47,107,255,.75);animation:floatY 5s ease-in-out infinite">و</div>
      <div style="font-size:52px;font-weight:900;margin-top:22px;line-height:1">وصلني</div>
      <div style="font-family:Outfit,sans-serif;font-size:11px;letter-spacing:.3em;color:var(--blue);margin-top:12px">DAMMAM · KHOBAR NETWORK</div>
      <div style="font-size:14.5px;color:var(--muted);margin-top:16px;max-width:280px;line-height:1.8">رحلتك اليومية بميكروباص مكيّف — سعر ثابت وموعد تعرفه.</div>
    </div>
    <div style="position:absolute;bottom:calc(46px + var(--safe-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:14px">
      <div style="width:26px;height:26px;border-radius:50%;border:3px solid rgba(47,107,255,.25);border-top-color:var(--blue);animation:spin .9s linear infinite"></div>
      <div style="font-size:11.5px;color:var(--faint);font-weight:600">جارٍ التحضير…</div>
    </div>
  </div>`;
POST.splash = () => { clearTimeout(POST.splash._t); POST.splash._t = setTimeout(() => go('welcome'), 2200); };

/* ============================================================

function startAuth(mode){ state.authMode = mode; state.phone=''; state.name=''; state.agree = mode==='signin'; go('auth'); }

function onNameInput(v){ state.name = v; refreshAuthCta(); }
function toggleAgree(){ state.agree = !state.agree; const b=$('agreeBox'); if(b){ b.style.background=state.agree?'#2F6BFF':'#fff'; b.style.borderColor=state.agree?'#2F6BFF':'#C7D2E8'; b.innerHTML=state.agree?'✓':''; } refreshAuthCta(); }
function authValid(){
  const okPhone = state.phone.length === 9;
  const okName = state.authMode==='signin' ? true : state.name.trim().length >= 2;
  return okPhone && okName && state.agree;
}
function refreshAuthCta(){ const b=$('authCta'); if(!b) return; const ok=authValid(); b.style.opacity=ok?'1':'.5'; b.style.pointerEvents=ok?'auto':'none'; }
function submitAuth(){
  if (!authValid()) return;
  if (state.authMode==='register' && state.name.trim()){
    state.userName = state.name.trim();
    state.userFirst = state.name.trim().split(/\s+/)[0];
  }
  go('otp');
}

/* ============================================================
   OTP
   ============================================================ */
function pressKey(k){
  if (k === 'del') { state.otp = state.otp.slice(0,-1); return renderOtpBoxes(); }
  if (k === 'ok') { if (state.otp.length===4) go('home'); return; }
  state.otp = (state.otp + k).slice(0,4);
  renderOtpBoxes();
  if (state.otp.length === 4) setTimeout(() => go('home'), 430);
}
function renderOtpBoxes(){
  const wrap = $('otpBoxes'); if (!wrap) return;
  wrap.querySelectorAll('.otpb').forEach((b,i) => {
    b.textContent = state.otp[i] || '';
    b.style.background = state.otp[i] ? '#E7EEFF' : '#F5F8FF';
    b.style.boxShadow = state.otp.length === i ? '0 0 0 2px #2F6BFF inset' : 'none';
  });
}
function maskPhone(){
  const p = state.phone || '555112413';
  const d = p.padStart(9,'•');
  // format like 5• ••• 41 23 keeping first + last visible-ish
  return d.slice(0,2) + ' ••• ' + d.slice(-4,-2) + ' ' + d.slice(-2);
}
function resendOtp(){ if (state.resend>0) return; state.resend = 42; state.otp=''; renderOtpBoxes(); toast('تم إرسال رمز جديد'); }

const ROUTE = [
  [26.4467,50.1030],[26.4421,50.1072],[26.4368,50.1118],[26.4295,50.1183],
  [26.4212,50.1256],[26.4128,50.1332],[26.4041,50.1418],[26.3955,50.1512],
  [26.3872,50.1618],[26.3796,50.1738],[26.3722,50.1866],[26.3655,50.1992],
  [26.3598,50.2104],[26.3562,50.2168]
];
const STOPS = [
  { at:0, label:'دوار الشاطئ الغربي', color:'#2F6BFF' },
  { at:4, label:'شارع الأمير محمد', color:'#7B61FF' },
  { at:8, label:'مجمع الظهران', color:'#7B61FF' },
  { at:13, label:'بوابة الجامعة 3', color:'#F0475B' }
];
function lerp(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
function pointAt(p){
  const t = Math.max(0,Math.min(0.999,p)) * (ROUTE.length-1);
  const i = Math.floor(t);
  return { pos: lerp(ROUTE[i], ROUTE[i+1], t-i), a:ROUTE[i], b:ROUTE[i+1] };
}
function bearing(a,b){
  const y = Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);
  const x = Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180) -
            Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}

function initMap(hostId, progress, follow){
  const host = $(hostId);
  if (!host) return;
  if (!window.L) {
    // retry a few times while the CDN script loads; then fall back gracefully
    initMap._tries = (initMap._tries || 0) + 1;
    if (initMap._tries < 25) { setTimeout(()=>initMap(hostId,progress,follow),150); }
    else { initMap._tries = 0; mapFallback(host, follow); }
    return;
  }
  initMap._tries = 0;
  destroyMap();
  mapProgress = progress; trackAnim = !!follow;

  // controls overlay
  const badge = document.createElement('div');
  badge.className = 'mapbadge';
  badge.innerHTML = `<span style="width:7px;height:7px;border-radius:99px;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.22)"></span>
    <span style="font-family:Outfit,sans-serif;font-size:9px;font-weight:500">SOCKET · GPS 1 Hz</span>
    <span id="mapCoords" style="font-family:Outfit,sans-serif;font-size:9px;color:#6B7A99;direction:ltr"></span>`;
  const ctrl = document.createElement('div');
  ctrl.className = 'mapctrl';
  ctrl.innerHTML = `<button id="mRecenter">◎</button><button id="mZin">+</button><button id="mZout">−</button>`;
  host.appendChild(badge); host.appendChild(ctrl);

  const mapDiv = document.createElement('div');
  mapDiv.style.cssText = 'position:absolute;inset:0';
  host.insertBefore(mapDiv, badge);

  const L = window.L;
  map = L.map(mapDiv, { zoomControl:false, attributionControl:true, dragging:true, scrollWheelZoom:false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap contributors' }).addTo(map);

  L.polyline(ROUTE, { color:'#1B44B8', weight:11, opacity:.18, lineCap:'round' }).addTo(map);
  L.polyline(ROUTE, { color:'#FFFFFF', weight:9, opacity:1, lineCap:'round' }).addTo(map);
  L.polyline(ROUTE, { color:'#9FBEFF', weight:5.5, opacity:1, lineCap:'round' }).addTo(map);
  const travelled = L.polyline([ROUTE[0]], { color:'#2F6BFF', weight:5.5, lineCap:'round' }).addTo(map);

  STOPS.forEach(st => {
    L.marker(ROUTE[st.at], { icon: L.divIcon({ className:'', iconSize:[24,24], iconAnchor:[12,12], html:'<div class="mv-pin" style="background:'+st.color+'"></div>' }) })
      .addTo(map).bindTooltip(st.label, { direction:'top', offset:[0,-10] });
  });

  const van = L.marker(ROUTE[0], { zIndexOffset:1000, icon: L.divIcon({ className:'', iconSize:[40,40], iconAnchor:[20,20], html:'<div class="mv-van"><i></i><b>🚐</b></div>' }) }).addTo(map);

  mapLayers = { travelled, van };
  map.fitBounds(L.latLngBounds(ROUTE), { padding:[46,46] });
  setTimeout(()=>{ if(map) map.invalidateSize(); mapUpdate(true); }, 60);

  $('mRecenter').onclick = () => { if(map) map.setView(pointAt(mapProgress).pos, 14, { animate:true }); };
  $('mZin').onclick = () => { if(map) map.zoomIn(); };
  $('mZout').onclick = () => { if(map) map.zoomOut(); };
}

function mapUpdate(fit){
  if (!map || !mapLayers) return;
  if (trackAnim) mapProgress = Math.max(0, Math.min(1, 0.12 + state.tick * 0.021));
  const p = mapProgress;
  const { pos, a, b } = pointAt(p);
  const idx = Math.floor(Math.max(0,Math.min(0.999,p)) * (ROUTE.length-1));
  mapLayers.travelled.setLatLngs([...ROUTE.slice(0, idx+1), pos]);
  mapLayers.van.setLatLng(pos);
  const el = mapLayers.van.getElement();
  if (el) { const bb = el.querySelector('b'); if (bb) bb.style.transform = 'rotate(' + (bearing(a,b)-45).toFixed(1) + 'deg)'; }
  const c = $('mapCoords'); if (c) c.textContent = pos[0].toFixed(4) + ', ' + pos[1].toFixed(4);
  if (trackAnim && !fit && map) map.panTo(pos, { animate:true, duration:.9 });
}

function destroyMap(){
  if (map) { try { map.remove(); } catch(e){} }
  map = null; mapLayers = null; trackAnim = false;
}

/* ============================================================
   INIT
   ============================================================ */
function setAppHeight(){
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}
setAppHeight();
window.addEventListener('resize', () => { setAppHeight(); if (map) map.invalidateSize(); });
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));

try {
  render();
} catch (err) {
  document.body.innerHTML =
    '<div style="padding:40px 24px;font-family:sans-serif;direction:rtl;text-align:center;color:#101A33">'
    + '<div style="font-size:20px;font-weight:800;margin-bottom:10px">تعذّر تشغيل العرض</div>'
    + '<div style="font-size:13px;color:#6B7A99;word-break:break-word">' + (err && err.message ? err.message : err) + '</div>'
    + '</div>';
}
</script>
</body>
</html>
